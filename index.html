<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Python Runner</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <style>
        body { font-family: monospace; background: #121212; color: #00ff00; padding: 20px; }
        #output { border: 1px solid #333; padding: 15px; background: #000; min-height: 200px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h3>Результат выполнения:</h3>
    <div id="output">Инициализация интерпретатора...</div>
    <script>
        async function main() {
            const output = document.getElementById('output');
            try {
                let pyodide = await loadPyodide();
                output.innerText = "Интерпретатор готов. Запуск кода...";
                
                const urlParams = new URLSearchParams(window.location.search);
                const encodedCode = urlParams.get('code');
                
                if (!encodedCode) {
                    output.innerText = "Ошибка: Код не передан в Mini App.";
                    return;
                }

                const code = atob(encodedCode);
                
                // Перехват вывода
                pyodide.runPython(`
import sys, io
sys.stdout = io.StringIO()
                `);
                
                // Выполнение
                await pyodide.runPythonAsync(code);
                
                // Получение результата
                let result = pyodide.runPython("sys.stdout.getvalue()");
                output.innerText = result || "Код выполнен (вывода нет).";
                
            } catch (err) {
                output.innerText = "Ошибка выполнения:\n" + err;
            }
        }
        main();
    </script>
</body>
</html>
