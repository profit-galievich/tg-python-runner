<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Python Runner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #e0e0e0);
            padding: 16px;
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }
        h3 { margin: 0 0 12px 0; color: var(--tg-theme-link-color, #0088cc); font-size: 18px; }
        #status {
            padding: 8px 12px;
            background: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        #status.loading { color: var(--tg-theme-link-color, #0088cc); }
        #status.success { color: #51cf66; }
        #status.error { color: #ff6b6b; }
        #output {
            border: 1px solid var(--tg-theme-hint-color, #444);
            padding: 14px;
            background: var(--tg-theme-secondary-bg-color, #0a0a0a);
            border-radius: 8px;
            min-height: 250px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            overflow-x: auto;
        }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--tg-theme-link-color, #0088cc);
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .code-info {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>🐍 Python Runner</h3>
    <div id="status" class="loading"><span class="loader"></span>Загрузка...</div>
    <div id="output">Ожидание кода...</div>
    <div class="code-info" id="codeInfo"></div>

    <script>
        // === Telegram WebApp ===
        if (window.Telegram?.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.disableVerticalSwipes();
        }

        // === Декодирование base64 → UTF-8 ===
        function base64ToUtf8(base64) {
            base64 = base64.replace(/-/g, '+').replace(/_/g, '/');
            const pad = base64.length % 4;
            if (pad) base64 += '='.repeat(4 - pad);
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        // === Загрузка кода из hastebin ===
        async function fetchCodeFromHastebin(key) {
            const response = await fetch(`https://hastebin.com/raw/${key}`);
            if (!response.ok) throw new Error(`Не удалось загрузить код: ${response.status}`);
            return await response.text();
        }

        // === Основная функция ===
        async function main() {
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            const codeInfo = document.getElementById('codeInfo');

            try {
                // Загрузка Pyodide
                if (!window.pyodide) {
                    window.pyodide = await loadPyodide({
                        indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
                    });
                }

                status.className = 'loading';
                status.innerHTML = '<span class="loader"></span>Интерпретатор готов. Загрузка кода...';

                // Получение параметров
                const urlParams = new URLSearchParams(window.location.search);
                const encodedCode = urlParams.get('code');
                const gistKey = urlParams.get('gist');

                let code = '';

                if (gistKey) {
                    // Загрузка из hastebin
                    status.innerHTML = '<span class="loader"></span>Загрузка кода из хранилища...';
                    code = await fetchCodeFromHastebin(gistKey);
                    codeInfo.textContent = `📦 Код загружен из hastebin.com/raw/${gistKey}`;
                } else if (encodedCode) {
                    // Загрузка из URL (короткий код)
                    code = base64ToUtf8(encodedCode);
                    codeInfo.textContent = `📋 Код передан в URL (${code.length} символов)`;
                } else {
                    throw new Error("Код не передан. Используйте ?code=... или ?gist=...");
                }

                // Настройка перехвата вывода
                window.pyodide.runPython(`
import sys, io
sys.stdout = io.StringIO()
sys.stderr = sys.stdout
                `);

                // Выполнение с таймаутом
                const executionPromise = window.pyodide.runPythonAsync(code);
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error("⏱ Таймаут: код выполнялся дольше 30 секунд")), 30000);
                });

                await Promise.race([executionPromise, timeoutPromise]);

                // Вывод результата
                let result = window.pyodide.runPython("sys.stdout.getvalue()");
                if (!result || !result.trim()) {
                    result = "✅ Код выполнен успешно (вывод в консоль отсутствует).";
                }

                output.textContent = result;
                status.className = 'success';
                status.textContent = '✨ Выполнено!';

            } catch (err) {
                status.className = 'error';
                status.textContent = '❌ Ошибка';
                
                let errorMsg = err.message || String(err);
                if (errorMsg.includes('null bytes')) {
                    errorMsg = "🔤 Ошибка кодировки! " + errorMsg;
                } else if (errorMsg.includes('SyntaxError')) {
                    errorMsg = "📝 Синтаксическая ошибка:\n\n" + errorMsg;
                }
                output.textContent = errorMsg + (err.stack ? "\n\n" + err.stack : "");
            }
        }

        main();
    </script>
</body>
</html>
