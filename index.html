<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #out { white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="out">Запуск интерпретатора...</div>
    <script>
        async function run() {
            const out = document.getElementById('out');
            try {
                let pyodide = await loadPyodide();
                const params = new URLSearchParams(window.location.search);
                let code = params.get('code');
                
                // Декодируем URL-безопасный Base64
                code = code.replace(/-/g, '+').replace(/_/g, '/');
                while (code.length % 4) code += '=';
                code = atob(code);

                pyodide.runPython("import sys, io; sys.stdout = io.StringIO()");
                await pyodide.runPythonAsync(code);
                out.innerText = pyodide.runPython("sys.stdout.getvalue()");
            } catch (e) {
                out.innerText = "Ошибка: " + e;
            }
        }
        run();
    </script>
</body>
</html>
